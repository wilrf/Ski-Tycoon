<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17233d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏔️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet" />
    <title>Summit Tycoon</title>
  </head>
  <body>
    <canvas id="map"></canvas>
    <header id="hud">
      <div class="brand">Summit Tycoon</div>
      <div class="stats">
        <span class="stat" data-icon="day"><b id="hud-day"></b></span>
        <span class="stat" data-icon="clock"><b id="hud-time"></b></span>
        <span class="stat money" data-icon="money"><b id="hud-money"></b></span>
        <span class="stat" data-icon="skier"><b id="hud-skiers"></b></span>
        <span class="stat" data-icon="happy"><b id="hud-happiness"></b></span>
        <span class="stat" title="Today’s weather and tomorrow’s forecast"><b id="hud-weather"></b></span>
        <button class="stat rating" id="hud-rating" title="Resort: rating, prices, land and requests (O)"></button>
      </div>
      <div id="speed" class="segmented" aria-label="Game speed">
        <button data-icon="pause" title="Pause (P)" aria-label="Pause"></button><button data-icon="play" title="Normal speed (1)" aria-label="Normal speed"></button><button data-icon="fast" title="Fast, 3× (2)" aria-label="Fast"></button><button data-icon="fastest" title="Fastest, 6× (3)" aria-label="Fastest"></button>
      </div>
      <div id="menu" class="segmented">
        <button data-menu="pause" title="Save, load, new mountain and help (M)">☰ Menu</button>
      </div>
    </header>
    <p id="hint" hidden></p>
    <aside id="panel" hidden></aside>
    <nav id="toolbar" aria-label="Build tools">
      <button data-tool="select" data-icon="select" title="Select (V)" style="--icon-fill: #ffd166"><span>Select</span></button>
      <button data-tool="ropeTow" data-icon="ropeTow" title="Rope tow (T)" style="--icon-fill: #e9a66b"><span>Tow</span></button>
      <button data-tool="chairlift" data-icon="chairlift" title="Chairlift (C)" style="--icon-fill: #f07167"><span>Chair</span></button>
      <button data-tool="gondola" data-icon="gondola" title="Gondola (G)" style="--icon-fill: #b388eb"><span>Gondola</span></button>
      <button data-tool="run" data-icon="run" title="Run (R)" style="--icon-fill: #8fd3ff"><span>Run</span></button>
      <button data-tool="lodge" title="Base lodge (L)" class="emoji-tool">🏠<span>Lodge</span></button>
      <button data-tool="hut" title="Mountain hut (H)" class="emoji-tool">🛖<span>Hut</span></button>
    </nav>
    <div id="toast" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
